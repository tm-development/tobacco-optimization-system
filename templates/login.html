<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 烟草生产优化系统</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --primary: #2E7D32;
      --primary-dark: #1B5E20;
      --primary-light: #4CAF50;
      --secondary: #FF9800;
      --dark-bg: #121212;
      --card-bg: #1E1E1E;
      --text-primary: #E0E0E0;
      --text-secondary: #9E9E9E;
    }
    
    body {
      background-color: var(--dark-bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(46, 125, 50, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(76, 175, 80, 0.1) 0%, transparent 50%);
    }
    
    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }
    
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(46, 125, 50, 0.3);
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
      font-size: 14px;
    }
    
    .form-input {
      width: 100%;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      background-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--text-secondary);
    }
    
    .input-icon {
      position: relative;
    }
    
    .input-icon .material-icons {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      z-index: 1;
    }
    
    .input-icon .form-input {
      padding-left: 50px;
    }
    
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.3);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .custom-checkbox {
      position: relative;
      width: 20px;
      height: 20px;
    }
    
    .custom-checkbox input {
      opacity: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }
    
    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    
    .custom-checkbox input:checked ~ .checkmark {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    
    .checkmark::after {
      content: "";
      position: absolute;
      display: none;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    .custom-checkbox input:checked ~ .checkmark::after {
      display: block;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: 16px;
    }
    
    .forgot-password a {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    
    .forgot-password a:hover {
      color: var(--primary-light);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 32px 0;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .divider span {
      padding: 0 16px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      display: none;
    }
    
    .alert.error {
      background-color: rgba(244, 67, 54, 0.1);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #F44336;
    }
    
    .alert.success {
      background-color: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: var(--primary-light);
    }
    
    .footer-links {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      margin: 0 16px;
      transition: color 0.3s ease;
    }
    
    .footer-links a:hover {
      color: var(--primary);
    }
    
    /* 响应式设计 */
    @media (max-width: 480px) {
      .login-container {
        padding: 16px;
      }
      
      .card {
        padding: 32px 24px;
      }
      
      .logo-icon {
        width: 60px;
        height: 60px;
      }
    }
    
    /* 加载动画 */
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    
    .loading .btn-primary {
      position: relative;
    }
    
    .loading .btn-primary::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <!-- Logo和标题 -->
      <div class="logo-section">
        <div class="logo-icon">
          <span class="material-icons text-white text-4xl">local_florist</span>
        </div>
        <h1 class="text-2xl font-bold mb-2">烟草生产优化系统</h1>
        <p class="text-gray-400 text-sm">请登录您的账户</p>
      </div>
      
      <!-- 错误/成功提示 -->
      <div id="alert" class="alert">
        <span id="alert-message"></span>
      </div>
      
      <!-- 登录表单 -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <div class="input-icon">
            <span class="material-icons">person</span>
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              placeholder="请输入用户名"
              required
            >
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-icon">
            <span class="material-icons">lock</span>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="请输入密码"
              required
            >
          </div>
        </div>
        
        <div class="checkbox-group">
          <label class="custom-checkbox">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
          </label>
          <span class="text-sm">记住登录状态</span>
        </div>
        
        <button type="submit" class="btn-primary">
          <span class="material-icons">login</span>
          登录系统
        </button>
        
        <div class="forgot-password">
          <a href="#" onclick="showForgotPassword()">忘记密码？</a>
        </div>
      </form>
      
      <!-- 分割线 -->
      <div class="divider">
        <span>或</span>
      </div>
      
      <!-- 其他登录方式 -->
      <div class="space-y-3">
        <button class="w-full py-3 px-4 border border-gray-600 rounded-lg text-gray-300 hover:bg-gray-700 transition flex items-center justify-center gap-2">
          <span class="material-icons">fingerprint</span>
          生物识别登录
        </button>
      </div>
      
      <!-- 页脚链接 -->
      <div class="footer-links">
        <a href="#" onclick="showHelp()">使用帮助</a>
        <a href="#" onclick="showContact()">联系支持</a>
        <a href="/">返回首页</a>
      </div>
    </div>
  </div>

  <script>    // 表单提交处理
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('remember').checked;
      
      // 前端验证逻辑
      if (!username || !password) {
        showAlert('请输入用户名和密码', 'error');
        return;
      }
      
      // 显示加载状态
      const form = document.getElementById('login-form');
      form.classList.add('loading');
      
      try {
        // 调用后端登录API
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username,
            password: password,
            remember: remember
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('登录成功，正在跳转...', 'success');
          
          // 跳转到主页
          setTimeout(() => {
            window.location.href = result.redirect_url || '/';
          }, 1500);
        } else {
          showAlert(result.error || '登录失败，请重试', 'error');
        }
      } catch (error) {
        console.error('登录请求失败:', error);
        showAlert('网络错误，请检查连接后重试', 'error');
      } finally {
        form.classList.remove('loading');
      }
    });
    
    // 显示提示信息
    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      const alertMessage = document.getElementById('alert-message');
      
      alert.className = `alert ${type}`;
      alertMessage.textContent = message;
      alert.style.display = 'block';
      
      // 自动隐藏错误提示
      if (type === 'error') {
        setTimeout(() => {
          alert.style.display = 'none';
        }, 5000);
      }
    }
    
    // 忘记密码处理
    function showForgotPassword() {
      showAlert('请联系系统管理员重置密码', 'error');
    }
    
    // 显示帮助
    function showHelp() {
      alert('使用帮助：\n\n1. 输入您的用户名和密码\n2. 可选择记住登录状态\n3. 点击登录系统按钮\n\n如有问题请联系系统管理员');
    }
    
    // 显示联系方式
    function showContact() {
      alert('技术支持联系方式：\n\n邮箱：support@tobacco-system.com\n电话：400-123-4567\n工作时间：周一至周五 9:00-18:00');
    }
    
    // 输入框焦点效果
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });
    
    // 键盘快捷键支持
    document.addEventListener('keydown', function(e) {
      // Ctrl+Enter 快速登录
      if (e.ctrlKey && e.key === 'Enter') {
        document.getElementById('login-form').dispatchEvent(new Event('submit'));
      }
    });
    
    // 页面加载完成后自动聚焦到用户名输入框
    window.addEventListener('load', function() {
      document.getElementById('username').focus();
    });
  </script>
</body>
</html>
